# Production deploy: every push to the Prod branch publishes site/ to GitHub Pages.
# main is the dev environment and is never deployed.
name: Deploy production

on:
  push:
    branches: [Prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/Prod'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
