<!-- Loader: greetings cycle while a gradient ring fills, then the panel lifts away (first visit only) -->
<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__glow"></div>
  <svg class="loader__ring" viewBox="0 0 120 120">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7b5cff" />
        <stop offset=".5" stop-color="#ff3e8a" />
        <stop offset="1" stop-color="#ffb020" />
      </linearGradient>
    </defs>
    <circle class="loader__track" cx="60" cy="60" r="54" />
    <circle class="loader__arc" id="loaderArc" cx="60" cy="60" r="54" stroke="url(#ringGrad)" />
  </svg>
  <p class="loader__word" id="loaderWord">Hello</p>
  <p class="loader__count mono"><span id="loaderCount">0</span>%</p>
</div>
