<footer class="footer">
  <div class="footer__inner">
    <p class="label">Got an idea, a collab or just a hello?</p>
    <a class="footer__cta" data-calendly href="{{root}}contact">Let's talk<span aria-hidden="true">↗</span></a>
    <p class="footer__sub">{{{reachHtml}}} or email <a data-email-link href="mailto:{{email}}">{{email}}</a>.</p>
    <div class="footer__cols">
      <div class="footer__col">
        <h2 class="footer__heading mono">Pages</h2>
        <ul>
          <li><a href="{{home}}">Home</a></li>
          <li><a href="{{root}}about">About</a></li>
          <li><a href="{{root}}blog/">Blog</a></li>
          <li><a href="{{root}}contact">Contact</a></li>
        </ul>
      </div>
      <div class="footer__col">
        <h2 class="footer__heading mono">Connect</h2>
        <ul>
          <li><a data-email-link href="mailto:{{email}}">{{email}}</a></li>
          <li data-socials-list></li>
        </ul>
      </div>
      <div class="footer__col">
        <h2 class="footer__heading mono">Based in</h2>
        <p>{{location}}</p>
        <p class="footer__time mono">Local time <b data-clock>--:--</b> <span data-tz>IST</span></p>
      </div>
    </div>
    <div class="footer__wordmark" aria-hidden="true">itsigni</div>
    <div class="footer__base mono">
      <span>© {{year}} {{fullName}}</span>
      <a href="#top">Back to top ↑</a>
    </div>
  </div>
</footer>
