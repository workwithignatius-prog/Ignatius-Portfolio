<!doctype html>
<html lang="en">
<head>
<!-- include:head -->
</head>
<body id="top" data-page="about" data-root="{{root}}">
<!-- include:bg -->
<!-- include:nav -->

<main id="main">
  <header class="page-head page-head--split">
    <div class="page-head__text">
      <p class="label">About</p>
      <h1 class="page-head__title">Hi, I'm <span class="hl">{{name}}</span></h1>
      <p class="page-head__lead" id="aboutLead"></p>
      <div class="prose prose--about" id="aboutText"></div>
      <div class="page-head__cta">
        <a class="btn btn--primary magnetic" data-calendly href="{{root}}contact.html"><span class="btn__dot" aria-hidden="true"></span> Let's talk</a>
        <a class="btn btn--ghost magnetic" href="#b-sides">Explore the B-sides <span aria-hidden="true">↘</span></a>
      </div>
    </div>
    <figure class="about-photo tilt" data-tilt="6">
      <div class="about-photo__frame" id="aboutPhoto" data-srcset="{{photoSrcset}}" data-sizes="(max-width: 392px) calc(100vw - 32px), (max-width: 860px) 360px, 420px"><span class="portrait__fallback" aria-hidden="true">IG</span></div>
      <figcaption class="about-photo__caption mono"><span class="dot"></span> <span data-location>{{location}}</span></figcaption>
    </figure>
  </header>

  <section class="section section--tight" aria-labelledby="factsTitle">
    <header class="section__head">
      <div>
        <p class="label">Other things</p>
        <h2 class="reveal" id="factsTitle" data-scramble>Little things</h2>
      </div>
    </header>
    <ul class="facts" id="facts"></ul>
  </section>

  <section class="section" id="b-sides">
    <header class="section__head">
      <div>
        <p class="label">Beyond work</p>
        <h2 class="reveal" data-scramble>The B-sides</h2>
      </div>
      <p class="section__note">What I do when I'm not at work. Hit play on any of them.</p>
    </header>
    <div class="albums" id="albums"></div>
  </section>
</main>

<!-- include:footer -->
<!-- include:scripts -->
</body>
</html>
