    <rect x="36" y="103" width="5" height="9" rx="2.5"/><rect x="45" y="103" width="5" height="9" rx="2.5"/>
    <rect x="72" y="103" width="5" height="9" rx="2.5"/><rect x="81" y="103" width="5" height="9" rx="2.5"/>
    <rect x="90" y="103" width="5" height="9" rx="2.5"/><rect x="99" y="103" width="5" height="9" rx="2.5"/>
