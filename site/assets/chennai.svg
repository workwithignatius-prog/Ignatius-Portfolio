    <ellipse cx="86" cy="52" rx="10" ry="4"/><ellipse cx="91" cy="49" rx="6" ry="4.5"/>
  </g>
  <g fill="none" stroke="#1c1a17" stroke-width="1" stroke-linecap="round">
    <path d="M38 22l2.5 2 2.5-2"/><path d="M45 17l2 1.6 2-1.6"/>
  </g>

  <!-- Corner towers -->
  <rect x="7" y="66" width="9" height="46" fill="#d2421f"/>
