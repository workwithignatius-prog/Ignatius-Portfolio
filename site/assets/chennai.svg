    <circle cx="21" cy="129" r="4.2" fill="#1c1a17"/><circle cx="21" cy="129" r="1.6" fill="#e8dcc4"/>
    <circle cx="47" cy="129" r="4.2" fill="#1c1a17"/><circle cx="47" cy="129" r="1.6" fill="#e8dcc4"/>
