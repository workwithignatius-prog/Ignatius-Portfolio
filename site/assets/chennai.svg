    <rect x="35" y="83" width="6" height="11" rx="3"/><rect x="44" y="83" width="6" height="11" rx="3"/>
    <rect x="71" y="83" width="6" height="11" rx="3"/><rect x="80" y="83" width="6" height="11" rx="3"/>
    <rect x="89" y="83" width="6" height="11" rx="3"/><rect x="98" y="83" width="6" height="11" rx="3"/>
